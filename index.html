<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p4_architecture_school</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Space Mono', monospace;
    font-size: 1em;
}

.plano {
    width: 450px;
    height: 700px;
    background-color: #ff1493;
    position: relative;
    margin: 20px auto;
    padding: 0;
}

.moda {
    width: 100%;
    height: 16%;
    background-color: white;
    border: 3px solid black;
    position: absolute;
    top: 0;
    left: 0;
    text-align: center;
    padding: 40px;
}

.edificio-central {
    width: 25%;
    height: 84%;
    background-color: white;
    border: 3px solid black;
    position: absolute;
    top: 16%;
    left: 0;
    text-align: center;
    padding: 5px;
}

.edificio-clase {
    width: 25%;
    height: 84%;
    background-color: white;
    border: 3px solid black;
    position: absolute;
    top: 16%;
    right: 0;
    text-align: center;
    padding: 5px;
}

.arboles {
    width: 30%;
    height: 37%;
    background-color: #dddddd;
    border-top: 3px solid black;
    border-right: 3px solid black;
    border-bottom: 3px solid black;
    position: absolute;
    top: 36%;
    left: 25%;
    text-align: center;
    padding: 15px;
}

.escaleras {
    width: 15%;
    height: 20%;
    background-color: white;
    border: 3px solid black;
    position: absolute;
    bottom: 0;
    left: 25%;
    text-align: right;
    padding: 5px;
}

.patio {
    position: absolute;
    top: 20%;
    left: 40%;
    font-size: 1em;
    color: black;
    text-align: center;
    padding: 10px;
}
    </style>
</head>
<body>
     <div class="plano">

        <div class="moda">
            MODA
        </div>

        <div class="edificio-central">
            EDIFICIO CENTRAL
        </div>

        <div class="arboles">
            ÁRBOLES Y PIEDRAS
        </div>

        <div class="escaleras">
            ESCALERAS
        </div>

        <div class="edificio-clase">
            EDIFICIO CLASE
        </div>

        <div class="patio">
            PATIO INTERIOR
        </div>

    </div>

</body>
</html>
